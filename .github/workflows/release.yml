name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Test
        run: |
          pip install build '.[playwright]' -r requirements.txt
          python -m playwright install --with-deps chromium
          python -m pytest tests
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the release tooling
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build, tag and draft the GitHub release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release
      - uses: actions/upload-artifact@v7
        if: steps.semantic-release.outputs.version
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: release
    if: needs.release.outputs.version
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/visual-regression-tracker/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
