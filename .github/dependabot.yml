version: 2
updates:
  - package-ecosystem: pip
    # requirements.txt pins the dev tools; pyproject.toml keeps ranges, raised only when a fix needs it
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      # one PR for all minor/patch bumps
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # majors usually need code changes, so they come apart from minor/patch
      pip-major:
        patterns:
          - "*"
        update-types:
          - major
      # security fixes in a single PR too
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    # package.json holds only the release tooling that release.yml installs
    directory: "/"
    schedule:
      interval: weekly
    groups:
      release-tooling:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # preset 10 needs conventional-changelog-writer 9; semantic-release 25 bundles writer 8
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
