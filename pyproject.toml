[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "visual_regression_tracker"
dynamic = ["version"]
description = "Open source, self hosted solution for visual testing and managing results of visual testing."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "requests>=2.32.4",
    "dacite>=1.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
playwright = ["playwright>=1.50"]

[project.urls]
Homepage = "https://github.com/Visual-Regression-Tracker/Visual-Regression-Tracker"
Source = "https://github.com/Visual-Regression-Tracker/sdk-python"
Issues = "https://github.com/Visual-Regression-Tracker/sdk-python/issues"

[tool.setuptools]
packages = ["visual_regression_tracker"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
python_classes = "NoThanks"
junit_family = "xunit2"
asyncio_default_fixture_loop_scope = "function"
